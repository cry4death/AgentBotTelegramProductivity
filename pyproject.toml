[project]
name = "procbot"
version = "0.1.0"
description = "Personal Telegram anti-procrastination assistant (single owner)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
    "cryptography>=50",
    "httpx>=0.28",
    "tzdata>=2026.1",
    "google-auth>=2.40",
    "google-auth-oauthlib>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "pyright>=1.1.414",
]

[project.scripts]
procbot = "procbot.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "RUF012", "ASYNC109", "SIM105"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

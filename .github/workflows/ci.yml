name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests migrations && uv run ruff format --check src tests migrations
      - name: Type check
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q

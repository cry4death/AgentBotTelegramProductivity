# Alembic configuration. The database URL is not stored here: env.py takes it
# from the programmatic config (procbot.main.alembic_config) or from
# DATABASE_PATH (.env), so the CLI and `alembic` itself use the same file.
#
#   uv run procbot migrate          # preferred: upgrade to head
#   uv run alembic upgrade head     # same, via alembic directly
#   uv run alembic revision --autogenerate -m "..."   # new revision

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is intentionally empty (see env.py)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
